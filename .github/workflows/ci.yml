name: CI — Build, Scan, Push, Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write        # OIDC → AWS (ECR push, EKS deploy)
  contents: write        # commit Helm image tag update back to repo
  pull-requests: write   # post scan/plan comments on PRs
  security-events: write # upload Trivy SARIF to GitHub Security tab

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: paystream-cluster
  IMAGE_TAG: ${{ github.sha }}

# ──────────────────────────────────────────────────────────────────────────────
# JOB 1 — Build & Test (full Maven reactor — all 15 modules)
# Runs on every push and PR — fastest feedback gate
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run unit + integration tests (full reactor)
        run: mvn clean verify -Dspring.profiles.active=test -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "*/target/surefire-reports/"

# ──────────────────────────────────────────────────────────────────────────────
# JOB 2 — Security Scan (source + dependencies)
# Trivy scans the whole repo for CVEs in source tree and Maven dependencies
# Results appear in GitHub → Security → Code scanning
# ──────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Trivy — scan source + dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

# ──────────────────────────────────────────────────────────────────────────────
# JOB 3 — Build & Push Docker images to ECR (one job per PayStream service)
# Only runs on push to main (not PRs). Matrix strategy builds all 14
# deployable services in parallel, each pushed to its own ECR repo
# (provisioned in infrastructure/ecr.tf).
# Uses OIDC — no AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY stored in GitHub
# ──────────────────────────────────────────────────────────────────────────────
  docker-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - config-server
          - discovery-server
          - api-gateway
          - auth-service
          - customer-service
          - account-service
          - neft-service
          - rtgs-service
          - imps-service
          - upi-service
          - transaction-service
          - fraud-detection-service
          - notification-service
          - audit-service

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: push
        working-directory: ${{ matrix.service }}
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE=$REGISTRY/${{ matrix.service }}:$IMAGE_TAG
          docker build -t $IMAGE -t $REGISTRY/${{ matrix.service }}:latest .
          docker push $IMAGE
          docker push $REGISTRY/${{ matrix.service }}:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Trivy — scan built container image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.push.outputs.image }}
          format: table
          severity: CRITICAL
          exit-code: "1"

# ──────────────────────────────────────────────────────────────────────────────
# JOB 4 — GitOps: update image tags in Helm values
# Commits the new SHA tag into helm/paystream-service/values/<service>.yaml
# for every PayStream service. ArgoCD ApplicationSets (k8s/argocd/*.yaml)
# watch the repo and auto-sync dev + staging; prod requires manual approval.
# ──────────────────────────────────────────────────────────────────────────────
  update-image-tag:
    name: GitOps — Update Helm Image Tags
    runs-on: ubuntu-latest
    needs: docker-push

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Update image tag for every PayStream service
        run: |
          for SERVICE in config-server discovery-server api-gateway auth-service \
                         customer-service account-service neft-service rtgs-service \
                         imps-service upi-service transaction-service \
                         fraud-detection-service notification-service audit-service; do
            yq -i ".image.tag = \"${{ env.IMAGE_TAG }}\"" \
              "helm/paystream-service/values/${SERVICE}.yaml"
          done

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/paystream-service/values/*.yaml
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore(deploy): update PayStream service images to ${{ env.IMAGE_TAG }} [skip ci]"
          git push

# ──────────────────────────────────────────────────────────────────────────────
# JOB 5 — Deploy to Staging via ArgoCD
# ArgoCD auto-sync handles this after the Helm values commit above.
# This job explicitly triggers the sync for every service and waits for
# rollout health.
# ──────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy — Staging
    runs-on: ubuntu-latest
    needs: update-image-tag
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: ArgoCD sync — staging (all PayStream services)
        run: |
          for SERVICE in config-server discovery-server api-gateway auth-service \
                         customer-service account-service neft-service rtgs-service \
                         imps-service upi-service transaction-service \
                         fraud-detection-service notification-service audit-service; do
            argocd app sync ${SERVICE}-staging \
              --server ${{ secrets.ARGOCD_SERVER }} \
              --auth-token ${{ secrets.ARGOCD_TOKEN }} \
              --insecure \
              --timeout 120
          done

      - name: Wait for rollout health
        run: |
          for SERVICE in config-server discovery-server api-gateway auth-service \
                         customer-service account-service neft-service rtgs-service \
                         imps-service upi-service transaction-service \
                         fraud-detection-service notification-service audit-service; do
            kubectl rollout status deployment/${SERVICE} \
              -n paystream-staging --timeout=5m
          done

# ──────────────────────────────────────────────────────────────────────────────
# JOB 6 — Deploy to Production via ArgoCD
# Gated by "production" GitHub Environment — requires manual approval in GitHub UI.
# ArgoCD Applications for prod have NO automated sync — human reviews before applying.
# ──────────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy — Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: ArgoCD sync — production (all PayStream services)
        run: |
          for SERVICE in config-server discovery-server api-gateway auth-service \
                         customer-service account-service neft-service rtgs-service \
                         imps-service upi-service transaction-service \
                         fraud-detection-service notification-service audit-service; do
            argocd app sync ${SERVICE}-prod \
              --server ${{ secrets.ARGOCD_SERVER }} \
              --auth-token ${{ secrets.ARGOCD_TOKEN }} \
              --insecure \
              --timeout 300
          done

      - name: Wait for production rollout
        run: |
          for SERVICE in config-server discovery-server api-gateway auth-service \
                         customer-service account-service neft-service rtgs-service \
                         imps-service upi-service transaction-service \
                         fraud-detection-service notification-service audit-service; do
            kubectl rollout status deployment/${SERVICE} \
              -n paystream-prod --timeout=10m
          done

      - name: Verify deployment health
        run: |
          kubectl get pods -n paystream-prod
