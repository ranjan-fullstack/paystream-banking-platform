# Defaults shared by every PayStream service. Overridden per-service by
# values/<service>.yaml and per-environment by values-<dev|staging|prod>.yaml.
# Merge order in `helm install/upgrade`:
#   -f values.yaml (this file, implicit)
#   -f values/<service>.yaml   (serviceName, image, containerPort)
#   -f values-<env>.yaml       (replicaCount, resources, namespace)

serviceName: ""
namespace: paystream-dev

replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 80

# Only api-gateway sets ingress.enabled=true (it's the single externally
# reachable entrypoint — every other service is ClusterIP-only, reached
# through Eureka + the gateway).
ingress:
  enabled: false
  host: ""
  path: /
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  path: /actuator/health
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

env:
  springProfile: docker

serviceAccountName: paystream-secrets-sa

# Secrets are pulled from AWS Secrets Manager at pod startup via the Secrets
# Store CSI Driver + IRSA (paystream-secrets-sa) — no static AWS keys, no
# plaintext values in this repo. The CSI volume mount triggers the sync;
# syncSecret.enabled on the driver mirrors it into the k8sSecretName Secret,
# which every container consumes via envFrom.
secrets:
  enabled: true
  className: paystream-app-secrets
  k8sSecretName: paystream-secrets

# Per-service overrides (e.g. SPRING_DATASOURCE_URL pointing at the in-cluster
# hostname instead of config-repo's localhost default) and extra volumes
# (e.g. config-server's mounted config-repo ConfigMap).
#
# MANAGEMENT_HEALTH_RABBIT_ENABLED=false: every service exposes "busrefresh"
# in management.endpoints (Spring Cloud Bus), which auto-configures a
# RabbitMQ HealthIndicator that folds into the aggregate /actuator/health
# result. No RabbitMQ is deployed in this cluster, so without this the
# probe can never observe UP -- every pod would sit in a permanent
# readiness/liveness failure loop regardless of the app's actual health.
extraEnv:
  MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
  # Separate from the above: Spring Cloud Stream contributes its own
  # "binders" health indicator (management.health.binders) reporting the
  # rabbit binder DOWN on connection refused -- confirmed via a direct
  # /actuator/health?show-details call, where every other component
  # (Eureka registration, config server, discovery client, disk, liveness)
  # was already UP.
  MANAGEMENT_HEALTH_BINDERS_ENABLED: "false"
extraVolumes: []
extraVolumeMounts: []

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1
