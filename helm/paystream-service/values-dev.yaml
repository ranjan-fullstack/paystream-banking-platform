namespace: paystream-dev
replicaCount: 1

# Dev images are pushed manually to a mutable :latest tag (no CI pipeline
# wired up yet -- see Jenkinsfile/ECR notes). IfNotPresent (the chart
# default, correct for staging/prod where CI pushes an immutable
# ${BUILD_NUMBER} tag) means kubelet just keeps using whatever :latest it
# already cached on that node and silently ignores newer pushes. Always
# is the right policy specifically because this environment reuses one tag.
image:
  pullPolicy: Always

# CPU limit deliberately omitted here: with ~14 CPU-hungry JVM cold starts
# packed onto 2 t3.medium nodes, summed CPU *limits* already exceeded node
# capacity (113%/111% allocatable). Kubernetes enforces limits via a hard
# CFS quota per pod, which throttles a JVM's class-loading burst even when
# the node has idle cycles sitting right next to it -- a well-known
# JVM-vs-cgroup pathology. Keeping the CPU request (for scheduling
# fairness) but dropping the limit lets each pod burst into whatever is
# actually free instead of being capped against a number that was never
# achievable for everyone simultaneously anyway. Memory limit stays, for
# OOM protection.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    # Helm deep-merges this map onto values.yaml's defaults key-by-key, so
    # omitting cpu here would NOT remove the base 250m limit -- it has to be
    # explicitly raised. 2 full vCPUs is effectively "don't throttle" given
    # node capacity, while the memory limit still guards against a runaway.
    cpu: "2000m"
    memory: 384Mi

hpa:
  minReplicas: 1
  maxReplicas: 2

pdb:
  minAvailable: 0

# Many JVM-based services share 2 small (t3.medium) nodes in this dev
# cluster with tight per-pod CPU limits (250m). Cold Spring Boot startup
# under that contention regularly exceeds the chart's default 45s liveness
# delay, so kubelet was killing pods before they finished booting. Generous
# probe timing here, not a fix for an app-level bug.
probes:
  initialDelaySeconds: 90
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6
