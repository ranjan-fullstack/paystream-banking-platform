serviceName: config-server
image:
  repository: 198758256599.dkr.ecr.ap-south-1.amazonaws.com/config-server
  tag: "latest"
containerPort: 8888

# The chart's default SPRING_PROFILES_ACTIVE=docker (env.springProfile)
# would make Spring Cloud Config Server fall back to its git-backed
# environment repository (no URI configured -> startup failure). This
# service specifically needs "native" to read config-repo/ from disk.
env:
  springProfile: native

extraEnv:
  CONFIG_REPO_PATH: /config-repo
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

extraVolumeMounts:
  - name: config-repo-vol
    mountPath: /config-repo
    readOnly: true

extraVolumes:
  - name: config-repo-vol
    configMap:
      name: paystream-config-repo
