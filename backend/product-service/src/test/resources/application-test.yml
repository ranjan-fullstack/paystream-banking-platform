spring:
  application:
    name: product-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false
  cache:
    type: simple
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  eureka:
    client:
      enabled: false
  kafka:
    listener:
      auto-startup: false

file:
  upload-dir: uploads

test:
  message: "test message"