bind 0.0.0.0
port 26379

# Monitor master — quorum 1 (minimum sentinels that must agree on failover)
sentinel monitor mymaster redis-master 6379 1

# Mark master as down after 5s of no response
sentinel down-after-milliseconds mymaster 5000

# Timeout for a failover to complete
sentinel failover-timeout mymaster 60000

# How many replicas to reconfigure in parallel after failover
sentinel parallel-syncs mymaster 1
