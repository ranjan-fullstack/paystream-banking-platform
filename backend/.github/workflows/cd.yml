name: CD — Owned by Jenkins

# Jenkins is the CD owner for this project.
# This file exists only for documentation and manual emergency deploys.
#
# Normal flow:
#   GitHub Push → CI workflow (test) → triggers Jenkins → Jenkins deploys to EKS
#
# Jenkins pipeline is defined in: backend/Jenkinsfile
# Jenkins job:                    flipkart-product-service
# Jenkins server:                 ${{ secrets.JENKINS_URL }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins manually
        run: |
          echo "Manual CD triggered by: ${{ github.actor }}"
          echo "Reason: ${{ inputs.reason }}"

          curl -X POST \
            "${{ secrets.JENKINS_URL }}/job/flipkart-product-service/build?token=${{ secrets.JENKINS_JOB_TOKEN }}" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            --fail

          echo "✅ Jenkins pipeline triggered"
