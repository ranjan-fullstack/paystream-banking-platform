name: CD — Deploy to Kubernetes

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/product-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        working-directory: backend
        run: mvn -pl product-service -am package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Blue-Green: push to the INACTIVE slot ──────────────────
      - name: Determine inactive slot
        id: slot
        run: |
          ACTIVE=$(kubectl get svc product-service -n flipkart \
            -o jsonpath='{.spec.selector.version}' 2>/dev/null || echo "blue")
          INACTIVE=$( [ "$ACTIVE" = "blue" ] && echo "green" || echo "blue" )
          echo "inactive=$INACTIVE" >> $GITHUB_OUTPUT

      - name: Build & push Docker image to inactive slot
        working-directory: backend/product-service
        run: |
          docker build \
            -t $IMAGE:${{ steps.slot.outputs.inactive }} \
            -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:${{ steps.slot.outputs.inactive }}
          docker push $IMAGE:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to inactive slot
        run: |
          kubectl set image deployment/product-service-${{ steps.slot.outputs.inactive }} \
            product-service=$IMAGE:${{ github.sha }} \
            -n flipkart
          kubectl rollout status deployment/product-service-${{ steps.slot.outputs.inactive }} \
            -n flipkart --timeout=120s

      - name: Run smoke test against inactive slot
        run: |
          kubectl run smoke-test --rm -i --restart=Never \
            --image=curlimages/curl:latest -n flipkart -- \
            curl -sf http://product-service-${{ steps.slot.outputs.inactive }}:8081/actuator/health

      - name: Switch traffic to inactive slot (cutover)
        run: |
          kubectl patch svc product-service -n flipkart \
            -p "{\"spec\":{\"selector\":{\"version\":\"${{ steps.slot.outputs.inactive }}\"}}}"

      - name: Verify rollout
        run: |
          echo "Traffic now pointing to: ${{ steps.slot.outputs.inactive }}"
          kubectl get svc product-service -n flipkart -o jsonpath='{.spec.selector}'
