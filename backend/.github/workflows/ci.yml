name: CI — Build, Test & Trigger Jenkins

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────
  # 1. BUILD & TEST
  # ──────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: |
          mvn -pl product-service -am clean verify \
              -Dspring.profiles.active=test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/product-service/target/surefire-reports/

  # ──────────────────────────────────────────────────
  # 2. TRIGGER JENKINS CD (only on push to main)
  # ──────────────────────────────────────────────────
  trigger-jenkins:
    name: Trigger Jenkins Pipeline
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Jenkins job via API
        run: |
          curl -X POST \
            "${{ secrets.JENKINS_URL }}/job/flipkart-product-service/build?token=${{ secrets.JENKINS_JOB_TOKEN }}" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            --fail \
            --silent \
            --show-error

          echo "✅ Jenkins pipeline triggered for commit ${{ github.sha }}"
