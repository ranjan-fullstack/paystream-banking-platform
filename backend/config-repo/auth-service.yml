server:
  port: 9005

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/flipkart_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    #url: jdbc:mysql://mysql:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    #username: authuser
    #password: authpass
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver   # ✅ ADD THIS

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect   # ✅ ADD THIS
    hibernate:
       #ddl-auto: update
       ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    jwt:
      secret: my-super-secret-key-my-super-secret-key
      access-token-expiration: 900000       # 15 minutes
      refresh-token-expiration: 604800000   # 7 days

management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info,busrefresh

logging:
  level:
    org.springframework.security: DEBUG
