server:
  port: 8081
  shutdown: graceful          # finish in-flight requests before exit

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s   # max wait before forcing shutdown

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5432/productdb
    # url: jdbc:postgresql://postgres:5432/productdb
    username: postgres
    password: "{cipher}53aaf0614a29cc9e76c68b757bddc02ffe87c4f3229f34aaf8debbdde4e8b73a"
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ProductServicePool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000     # 20s — fail fast if no connection available
      idle-timeout: 300000          # 5 min idle before closing
      max-lifetime: 1200000         # 20 min max connection lifetime

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 30            # batch up to 30 inserts/updates per round trip
          fetch_size: 50            # fetch 50 rows per JDBC round trip
        order_inserts: true         # group inserts by entity type for batching
        order_updates: true
        generate_statistics: true   # enables N+1 detection in dev logs

  flyway:
    enabled: false
    repair: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    # bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  cache:
    type: redis

  data:
    redis:
      host: localhost
      # host: redis
      port: 6379
      timeout: 60000

  cloud:
    discovery:
      locator:
        enabled: true
        lower-case-service-id: true

    loadbalancer:
      retry:
        enabled: true

# ------------------------------------------
# ✅ EUREKA
# ------------------------------------------
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
      # defaultZone: http://discovery-server:8761/eureka/

# ------------------------------------------
# ✅ AWS S3 + CLOUDFRONT
# ------------------------------------------
aws:
  access-key: ${AWS_ACCESS_KEY:your-access-key}
  secret-key: ${AWS_SECRET_KEY:your-secret-key}
  region: ap-south-1
  s3:
    bucket: flipkart-clone-products
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN:your-distribution-id.cloudfront.net}

# ------------------------------------------
# ✅ FEIGN + CIRCUIT BREAKER
# ------------------------------------------
feign:
  circuitbreaker:
    enabled: true

  client:
    config:
      inventory-service:
        retryer: feign.Retryer.Default
        connectTimeout: 2000
        readTimeout: 3000

# ------------------------------------------
# ✅ RESILIENCE4J
# ------------------------------------------
resilience4j:

  circuitbreaker:
    instances:
      inventoryService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.lang.Exception

  retry:
    instances:
      inventoryService:
        maxAttempts: 3
        waitDuration: 1s

  ratelimiter:
    instances:
      inventoryService:
        limitForPeriod: 5
        limitRefreshPeriod: 10s
        timeoutDuration: 0

  bulkhead:
    instances:
      inventoryService:
        maxConcurrentCalls: 5
        maxWaitDuration: 0

  timelimiter:
    instances:
      inventoryService:
        timeoutDuration: 2s
        cancelRunningFuture: true

# ------------------------------------------
# ✅ ACTUATOR + OBSERVABILITY
# ------------------------------------------
management:
  endpoints:
    web:
      exposure:
        #include: health,info,metrics,prometheus,refresh,busrefresh,traces
        include: "*"

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true   # ✅ liveness + readiness

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 1.0   # ⚠️ reduce in production (0.1)

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# ------------------------------------------
# ✅ LOGGING (TRACE ID)
# ------------------------------------------
logging:
  level:
    org.springframework.cache: TRACE

  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

# ------------------------------------------
# ✅ FEATURE TOGGLES
# ------------------------------------------
features:
  bulk-upload-enabled: true
  ai-pricing-enabled: false
  new-review-flow-enabled: false

# ------------------------------------------
# ✅ SENTRY
# ------------------------------------------
sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.2
  environment: local
  send-default-pii: false

# ------------------------------------------
# ✅ TEST CONFIG
# ------------------------------------------
test:
  message: "HELLO VERSION 5"