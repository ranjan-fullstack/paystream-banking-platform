global:
  scrape_interval: 5s
  evaluation_interval: 15s

# ✅ SLO alerting rules
rule_files:
  - "prometheus-rules.yml"

scrape_configs:

  # ✅ LOCAL SERVICES (running from IDE)
  - job_name: 'product-service-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: 'inventory-service-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']

  - job_name: 'auth-service-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9005']

  - job_name: 'api-gateway-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9000']
