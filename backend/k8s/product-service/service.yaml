apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: flipkart
spec:
  selector:
    app: product-service
    version: blue          # Switch to "green" for blue-green cutover
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081
  type: ClusterIP           # Exposed via API Gateway Ingress, not directly
