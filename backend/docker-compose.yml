version: "3.9"

services:

  # -------------------------------
  # 🟢 DATABASES
  # -------------------------------
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: productdocker
      POSTGRES_USER: postgresdocker
      POSTGRES_PASSWORD: admindocker
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: authdb
      MYSQL_USER: authuser
      MYSQL_PASSWORD: authpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_data:/var/lib/mysql

  # -------------------------------
  # 🔵 REDIS (SENTINEL CLUSTER)
  # -------------------------------
  redis-master:
    image: redis:7
    container_name: redis-master
    ports:
      - "6379:6379"

  redis-replica:
    image: redis:7
    container_name: redis-replica
    ports:
      - "6380:6379"
    command: redis-server --replicaof redis-master 6379
    depends_on:
      - redis-master

  redis-sentinel:
    image: redis:7
    container_name: redis-sentinel
    ports:
      - "26379:26379"
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica

  # -------------------------------
  # 🟠 RABBITMQ
  # -------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # -------------------------------
  # 🟡 KAFKA + ZOOKEEPER (FIXED)
  # -------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # ✅ FIX: supports BOTH local + docker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # -------------------------------
  # 🔍 ZIPKIN
  # -------------------------------
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"

  # -------------------------------
  # 📊 PROMETHEUS
  # -------------------------------
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # -------------------------------
  # 📈 GRAFANA
  # -------------------------------
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  # -------------------------------
  # 📋 LOKI (central log store)
  # -------------------------------
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  # -------------------------------
  # 🧭 DISCOVERY + CONFIG
  # -------------------------------
  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"

  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      - discovery-server
    volumes:
      - F:/projects/flipkart-clone/backend/config-repo:/config-repo

  # -------------------------------
  # 🧪 PRODUCT MIGRATION
  # -------------------------------
  product-migration:
    build: ./product-service
    ports:
      - "9008:9008"
    depends_on:
      - postgres
      - redis-sentinel
      - kafka
      - rabbitmq
      - config-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_ENABLED: true

  # -------------------------------
  # 🟢 PRODUCT SERVICE
  # -------------------------------
  product-service:
    build: ./product-service
    depends_on:
      - postgres
      - redis-sentinel
      - kafka
      - rabbitmq
      - config-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_ENABLED: false

  # -------------------------------
  # 🔐 AUTH SERVICE
  # -------------------------------
  auth-service:
    build: ./auth-service
    container_name: auth-service
    depends_on:
      - mysql
      - discovery-server
      - config-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9005:9005"

  # -------------------------------
  # 🌐 API GATEWAY
  # -------------------------------
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - discovery-server
      - config-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9000:9000"

volumes:
  postgres_data:
  mysql_data: