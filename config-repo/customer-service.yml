server:
  port: 9002

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/paystream_customers?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
    #url: jdbc:mysql://mysql:3306/paystream_customers?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${CUSTOMER_DB_USERNAME:root}
    password: ${CUSTOMER_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

paystream:
  keystore:
    path: classpath:paystream-keystore.jceks
    store-password: ${KEYSTORE_STORE_PASSWORD:paystream-keystore-password}
    key-alias: pii-encryption-key
    key-password: ${KEYSTORE_KEY_PASSWORD:paystream-key-password}

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
