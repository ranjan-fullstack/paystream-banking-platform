server:
  port: 9008

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/paystream_transactions
    #url: jdbc:postgresql://postgres:5432/paystream_transactions
    username: ${TRANSACTION_DB_USERNAME:postgres}
    password: ${TRANSACTION_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: localhost:29092
    #bootstrap-servers: kafka:9092
    consumer:
      group-id: transaction-service-group

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
