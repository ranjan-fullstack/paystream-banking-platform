global:
  scrape_interval: 5s
  evaluation_interval: 15s

# ✅ SLO alerting rules
rule_files:
  - "prometheus-rules.yml"

scrape_configs:

  # ✅ LOCAL SERVICES (running from IDE on host machine ports)
  - job_name: 'config-server-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8888']

  - job_name: 'discovery-server-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8761']

  - job_name: 'api-gateway-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9000']

  - job_name: 'auth-service-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9005']

