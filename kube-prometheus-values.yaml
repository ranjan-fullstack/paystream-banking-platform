prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 1Gi}
    walCompression: true
grafana:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
  adminPassword: paystream-admin
alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 128Mi}
prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
kube-state-metrics:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
nodeExporter:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
