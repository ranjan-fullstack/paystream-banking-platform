apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: paystream-services
  namespace: paystream-dev
  labels:
    # Required for the kube-prometheus-stack Prometheus CR to pick this up
    # (its serviceMonitorSelector matches release: kube-prometheus-stack).
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - paystream-dev
  selector:
    matchLabels:
      app.kubernetes.io/part-of: paystream-banking-platform
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
