# ─────────────────────────────────────────────────────────────────────────────
# NAMESPACE: paystream-dev
#
# ResourceQuota — hard ceiling on total resources the namespace can consume.
#   Dev runs 1 replica per service (14 services).
#   Quota set at ~4× minimum so devs can experiment without hitting walls.
#
# LimitRange — default requests/limits for containers that omit them,
#   and a hard max so a misconfigured pod can't starve neighbours.
#
# Apply: kubectl apply -f k8s/quota/namespace-dev.yaml -n paystream-dev
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ResourceQuota
metadata:
  name: paystream-dev-quota
  namespace: paystream-dev
spec:
  hard:
    # Compute
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    # Workloads
    pods: "40"
    # Storage
    persistentvolumeclaims: "10"
    requests.storage: 50Gi
    # Object count guards
    services: "20"
    secrets: "30"
    configmaps: "30"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: paystream-dev-limitrange
  namespace: paystream-dev
spec:
  limits:
    # Container-level defaults and bounds
    - type: Container
      default:            # applied when a container omits `resources.limits`
        cpu: 200m
        memory: 512Mi
      defaultRequest:     # applied when a container omits `resources.requests`
        cpu: 50m
        memory: 128Mi
      max:                # hard cap per container — prevents runaway pods
        cpu: "1"
        memory: 2Gi
      min:
        cpu: 10m
        memory: 32Mi
    # Pod-level cap (sum of all containers in a pod)
    - type: Pod
      max:
        cpu: "2"
        memory: 4Gi
