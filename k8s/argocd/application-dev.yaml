apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: paystream-dev
  namespace: argocd
spec:
  generators:
    # Scoped to the 5 services with images actually built and pushed to ECR.
    # t3.medium's default VPC-CNI pod density ceiling (17 pods/node) was hit
    # running all 14 as ImagePullBackOff placeholders alongside ArgoCD, the
    # secrets-store CSI driver, and the dev datastores. Re-add the rest here
    # once their images exist (Jenkins CI, or built manually as with these 5).
    - list:
        elements:
          - service: config-server
          - service: discovery-server
          - service: api-gateway
          - service: auth-service
          - service: account-service
          - service: customer-service
  template:
    metadata:
      name: '{{service}}-dev'
      namespace: argocd
      annotations:
        notifications.argoproj.io/subscribe.on-sync-succeeded.slack: paystream-deployments
        notifications.argoproj.io/subscribe.on-sync-failed.slack: paystream-deployments
    spec:
      project: default

      source:
        repoURL: https://github.com/ranjan-fullstack/paystream-banking-platform.git
        targetRevision: HEAD
        path: helm/paystream-service
        helm:
          valueFiles:
            - values.yaml
            - 'values/{{service}}.yaml'
            - values-dev.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: paystream-dev

      syncPolicy:
        automated:                  # DEV auto-syncs on every Git change
          prune: true
          selfHeal: true            # If someone manually changes K8s, ArgoCD reverts it
        syncOptions:
          - CreateNamespace=true
