apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: paystream-dev
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: config-server
          - service: discovery-server
          - service: api-gateway
          - service: auth-service
          - service: customer-service
          - service: account-service
          - service: neft-service
          - service: rtgs-service
          - service: imps-service
          - service: upi-service
          - service: transaction-service
          - service: fraud-detection-service
          - service: notification-service
          - service: audit-service
  template:
    metadata:
      name: '{{service}}-dev'
      namespace: argocd
      annotations:
        notifications.argoproj.io/subscribe.on-sync-succeeded.slack: paystream-deployments
        notifications.argoproj.io/subscribe.on-sync-failed.slack: paystream-deployments
    spec:
      project: default

      source:
        repoURL: https://github.com/ranjan-fullstack/paystream-banking-platform.git
        targetRevision: HEAD
        path: backend/helm/paystream-service
        helm:
          valueFiles:
            - values.yaml
            - 'values/{{service}}.yaml'
            - values-dev.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: paystream-dev

      syncPolicy:
        automated:                  # DEV auto-syncs on every Git change
          prune: true
          selfHeal: true            # If someone manually changes K8s, ArgoCD reverts it
        syncOptions:
          - CreateNamespace=true
