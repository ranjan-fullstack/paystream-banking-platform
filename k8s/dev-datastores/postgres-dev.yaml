apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-dev
  namespace: paystream-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-dev
  template:
    metadata:
      labels:
        app: postgres-dev
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: paystream_accounts
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: paystream-secrets
                  key: ACCOUNT_DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paystream-secrets
                  key: ACCOUNT_DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-dev
  namespace: paystream-dev
spec:
  selector:
    app: postgres-dev
  ports:
    - port: 5432
      targetPort: 5432
