  auth-service.yml: |
    server:
      port: 9005

    spring:
      datasource:
        url: jdbc:mysql://localhost:3306/paystream_auth?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
        #url: jdbc:mysql://mysql:3306/paystream_auth?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${AUTH_DB_USERNAME:root}
        password: ${AUTH_DB_PASSWORD:root}
        driver-class-name: com.mysql.cj.jdbc.Driver

      jpa:
        database-platform: org.hibernate.dialect.MySQLDialect
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            format_sql: false

      flyway:
        baseline-on-migrate: true
        baseline-version: 1

      security:
        jwt:
          keystore:
            path: classpath:paystream-jwt.jks
            store-password: ${JWT_KEYSTORE_PASSWORD:paystream-keystore-password}
            key-alias: jwt-signing-key
            key-password: ${JWT_KEY_PASSWORD:paystream-keystore-password}
          access-token-expiration: 900000       # 15 minutes
          refresh-token-expiration: 604800000   # 7 days

      data:
        redis:
          host: ${REDIS_HOST:localhost}
          port: ${REDIS_PORT:6379}

    management:
      endpoints:
        web:
          exposure:
            include: refresh,health,info,busrefresh
      tracing:
        sampling:
          probability: 1.0
      zipkin:
        tracing:
          endpoint: http://zipkin:9411/api/v2/spans

    logging:
      level:
        org.springframework.security: INFO
