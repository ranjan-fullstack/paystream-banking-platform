apiVersion: v1
data:
  account-service.yml: |
    server:
      port: 9003

    spring:
      datasource:
        url: jdbc:postgresql://localhost:5433/paystream_accounts
        #url: jdbc:postgresql://postgres:5432/paystream_accounts
        username: ${ACCOUNT_DB_USERNAME:postgres}
        password: ${ACCOUNT_DB_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver

      jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            format_sql: false

      flyway:
        baseline-on-migrate: true
        baseline-version: 1

      kafka:
        bootstrap-servers: localhost:29092
        #bootstrap-servers: kafka:9092

      cloud:
        openfeign:
          circuitbreaker:
            enabled: true

    management:
      endpoints:
        web:
          exposure:
            include: health,info,refresh,busrefresh
      tracing:
        sampling:
          probability: 1.0
      zipkin:
        tracing:
          endpoint: http://zipkin:9411/api/v2/spans

    resilience4j:
      circuitbreaker:
        instances:
          auth-service:
            sliding-window-size: 10
            failure-rate-threshold: 50
            wait-duration-in-open-state: 10s
            permitted-number-of-calls-in-half-open-state: 3
      retry:
        instances:
          auth-service:
            max-attempts: 3
            wait-duration: 500ms
            retry-exceptions:
              - feign.FeignException
  api-gateway.yml: |
    server:
      port: 9000

    spring:
      application:
        name: api-gateway

      # ------------------------------------------
      # Redis (for RequestRateLimiter)
      # ------------------------------------------
      data:
        redis:
          host: localhost
          # host: redis-sentinel (docker)
          port: 6379

      cloud:
        gateway:

          # ------------------------------------------
          # GLOBAL CORS
          # ------------------------------------------
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600

          # ------------------------------------------
          # RATE LIMITING (applied to all routes)
          # ------------------------------------------
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10    # tokens added per second
                redis-rate-limiter.burstCapacity: 20    # max tokens in bucket
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:

            # ------------------------------------------
            # AUTH SERVICE (mostly public; /auth/v1/admin/** requires an ADMIN JWT)
            # ------------------------------------------
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/v1/**

            # ------------------------------------------
            # CUSTOMER SERVICE - KYC / customer profile
            # ------------------------------------------
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/customers/**

            # ------------------------------------------
            # ACCOUNT SERVICE - bank accounts, balances, limits
            # ------------------------------------------
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/v1/accounts/**

            # ------------------------------------------
            # ACCOUNT SERVICE - branch-manager account operations
            # ------------------------------------------
            - id: account-service-branch
              uri: lb://account-service
              predicates:
                - Path=/api/v1/branch/**

            # ------------------------------------------
            # NEFT SERVICE
            # ------------------------------------------
            - id: neft-service
              uri: lb://neft-service
              predicates:
                - Path=/api/v1/neft/**

            # ------------------------------------------
            # RTGS SERVICE
            # ------------------------------------------
            - id: rtgs-service
              uri: lb://rtgs-service
              predicates:
                - Path=/api/v1/rtgs/**

            # ------------------------------------------
            # IMPS SERVICE
            # ------------------------------------------
            - id: imps-service
              uri: lb://imps-service
              predicates:
                - Path=/api/v1/imps/**

            # ------------------------------------------
            # UPI SERVICE
            # ------------------------------------------
            - id: upi-service
              uri: lb://upi-service
              predicates:
                - Path=/api/v1/upi/**

            # ------------------------------------------
            # TRANSACTION SERVICE - central ledger
            # ------------------------------------------
            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/v1/transactions/**

            # ------------------------------------------
            # FRAUD DETECTION SERVICE
            # ------------------------------------------
            - id: fraud-detection-service
              uri: lb://fraud-detection-service
              predicates:
                - Path=/api/v1/fraud/**

            # ------------------------------------------
            # NOTIFICATION SERVICE
            # ------------------------------------------
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**

            # ------------------------------------------
            # AUDIT SERVICE
            # ------------------------------------------
            - id: audit-service
              uri: lb://audit-service
              predicates:
                - Path=/api/v1/audit/**

            # ------------------------------------------
            # INTERNAL ENDPOINTS (API-key protected by
            # ApiKeyFilter, not JWT) - service-to-service
            # calls such as account validate/debit/credit
            # ------------------------------------------
            - id: account-service-internal
              uri: lb://account-service
              predicates:
                - Path=/internal/accounts/**

    # ------------------------------------------
    # EUREKA
    # ------------------------------------------
    eureka:
      client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
          defaultZone: http://localhost:8761/eureka/
          #defaultZone: http://discovery-server:8761/eureka/

    # ------------------------------------------
    # JWT RS256 KEYSTORE (public key for verification)
    # ------------------------------------------
    jwt:
      keystore:
        path: classpath:paystream-jwt.jks
        store-password: ${JWT_KEYSTORE_PASSWORD:paystream-keystore-password}
        key-alias: jwt-signing-key

    # ------------------------------------------
    # API KEY CONFIG
    # ------------------------------------------
    api:
      key:
        value: ${API_KEY:paystream-internal-key}

    # ------------------------------------------
    # ACTUATOR
    # ------------------------------------------
    management:
      endpoints:
        web:
          exposure:
            include: health,info,refresh,busrefresh
      tracing:
        sampling:
          probability: 1.0
      zipkin:
        tracing:
          endpoint: http://zipkin:9411/api/v2/spans
  application.yml: |
    spring:
      rabbitmq:
        host: localhost
        #host: rabbitmq
        port: 5672
        username: guest
        password: guest

    jwt:
      secret: ${JWT_SECRET}
