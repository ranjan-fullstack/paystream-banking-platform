apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-dev
  namespace: paystream-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-dev
  template:
    metadata:
      labels:
        app: mysql-dev
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: paystream_auth
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: paystream-secrets
                  key: AUTH_DB_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paystream-secrets
                  key: AUTH_DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paystream-secrets
                  key: AUTH_DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-dev
  namespace: paystream-dev
spec:
  selector:
    app: mysql-dev
  ports:
    - port: 3306
      targetPort: 3306
